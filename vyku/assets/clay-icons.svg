<!--
  Clay 图标 sprite · V0.14.0 · 随 clay-html / clay-webapp 分发
  ==============================================================
  用途：Clay 设计系统的线性图标单一来源。
        25 个图标统一取自 24x24 网格：内容收在 2 到 22 的安全区内，
        视觉重心居中、描边粗细一致（1.5px、圆头端点、圆角折点），
        形状优先几何化、克制，可辨识度优先。

  用法：
        <svg width="24" height="24" aria-hidden="true"><use href="#clay-icon-check"/></svg>
        图标的实际尺寸与颜色交给外层 CSS 决定，图标内部不声明尺寸。

  颜色：所有几何只描边、不填充，描边色为 currentColor。
        含义是：颜色完全由使用方上下文决定 —— 图标继承父级 color
        （Clay 规范下默认取次级标题色，暗色模式随主题自动切换）。
        强调色 Clay 每屏至多一处，普通图标不得染强调色。

  引用：把本文件内联进页面后按 #clay-icon-<name> 使用；
        或 <use href="clay-icons.svg#clay-icon-<name>"/> 外链引用。
  ==============================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- 导航 -->
  <symbol id="clay-icon-arrow-right" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="12" x2="20" y2="12"/>
      <polyline points="14 6 20 12 14 18"/>
    </g>
  </symbol>

  <symbol id="clay-icon-arrow-up-right" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5.5" y1="18.5" x2="18.5" y2="5.5"/>
      <polyline points="8.5 5.5 18.5 5.5 18.5 15.5"/>
    </g>
  </symbol>

  <symbol id="clay-icon-chevron-down" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"/>
    </g>
  </symbol>

  <symbol id="clay-icon-chevron-right" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 6 15 12 9 18"/>
    </g>
  </symbol>

  <!-- 操作 -->
  <symbol id="clay-icon-check" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 12.5 9 17.5 20 6.5"/>
    </g>
  </symbol>

  <symbol id="clay-icon-close" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="6" y1="6" x2="18" y2="18"/>
      <line x1="18" y1="6" x2="6" y2="18"/>
    </g>
  </symbol>

  <symbol id="clay-icon-plus" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="12" x2="19" y2="12"/>
      <line x1="12" y1="5" x2="12" y2="19"/>
    </g>
  </symbol>

  <symbol id="clay-icon-minus" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="12" x2="19" y2="12"/>
    </g>
  </symbol>

  <symbol id="clay-icon-search" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="16.5" y1="16.5" x2="21" y2="21"/>
    </g>
  </symbol>

  <symbol id="clay-icon-settings" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.15 3.29L13.85 3.29L13.68 5.93L15.10 6.52L16.85 4.54L19.46 7.15L17.48 8.90L18.07 10.32L20.71 10.15L20.71 13.85L18.07 13.68L17.48 15.10L19.46 16.85L16.85 19.46L15.10 17.48L13.68 18.07L13.85 20.71L10.15 20.71L10.32 18.07L8.90 17.48L7.15 19.46L4.54 16.85L6.52 15.10L5.93 13.68L3.29 13.85L3.29 10.15L5.93 10.32L6.52 8.90L4.54 7.15L7.15 4.54L8.90 6.52L10.32 5.93Z"/>
      <circle cx="12" cy="12" r="3"/>
    </g>
  </symbol>

  <symbol id="clay-icon-copy" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8.5" y="8.5" width="11" height="11" rx="2"/>
      <path d="M14.5 4.5H6.5A2 2 0 0 0 4.5 6.5V14.5"/>
    </g>
  </symbol>

  <symbol id="clay-icon-trash" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4.5" y1="7" x2="19.5" y2="7"/>
      <path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4H13.5A1.5 1.5 0 0 1 15 5.5V7"/>
      <path d="M6 7V18A2.5 2.5 0 0 0 8.5 20.5H15.5A2.5 2.5 0 0 0 18 18V7"/>
      <line x1="10" y1="11" x2="10" y2="17"/>
      <line x1="14" y1="11" x2="14" y2="17"/>
    </g>
  </symbol>

  <symbol id="clay-icon-edit" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20L4.5 16L16.5 4L20 7.5L8 19.5L4 20Z"/>
      <line x1="6.5" y1="14" x2="10" y2="17.5"/>
    </g>
  </symbol>

  <!-- 对象 -->
  <symbol id="clay-icon-user" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="7.5" r="4"/>
      <path d="M19 20.5A7 7 0 0 0 5 20.5"/>
    </g>
  </symbol>

  <symbol id="clay-icon-calendar" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="5.5" width="17" height="15" rx="2"/>
      <line x1="3.5" y1="10" x2="20.5" y2="10"/>
      <line x1="8" y1="3.5" x2="8" y2="7.5"/>
      <line x1="16" y1="3.5" x2="16" y2="7.5"/>
    </g>
  </symbol>

  <symbol id="clay-icon-clock" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5"/>
      <polyline points="12 7 12 12 15 14"/>
    </g>
  </symbol>

  <symbol id="clay-icon-file" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.5 3.5H7.5A2 2 0 0 0 5.5 5.5V18.5A2 2 0 0 0 7.5 20.5H16.5A2 2 0 0 0 18.5 18.5V8.5L13.5 3.5Z"/>
      <polyline points="13.5 3.5 13.5 8.5 18.5 8.5"/>
    </g>
  </symbol>

  <symbol id="clay-icon-folder" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 18.5V6.5A2 2 0 0 1 5.5 4.5H9L11.5 7.5H18.5A2 2 0 0 1 20.5 9.5V18.5A2 2 0 0 1 18.5 20.5H5.5A2 2 0 0 1 3.5 18.5Z"/>
    </g>
  </symbol>

  <!-- 数据传输 -->
  <symbol id="clay-icon-download" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4V15"/>
      <polyline points="7.5 10.5 12 15 16.5 10.5"/>
      <path d="M20 17.5V18.5A2 2 0 0 1 18 20.5H6A2 2 0 0 1 4 18.5V17.5"/>
    </g>
  </symbol>

  <symbol id="clay-icon-upload" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 15V4"/>
      <polyline points="7.5 8.5 12 4 16.5 8.5"/>
      <path d="M20 17.5V18.5A2 2 0 0 1 18 20.5H6A2 2 0 0 1 4 18.5V17.5"/>
    </g>
  </symbol>

  <!-- 状态 -->
  <symbol id="clay-icon-info" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5"/>
      <circle cx="12" cy="7.5" r="0.75" fill="currentColor" stroke="none"/>
      <line x1="12" y1="10.5" x2="12" y2="16.5"/>
    </g>
  </symbol>

  <symbol id="clay-icon-alert-triangle" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.5 17L13.5 5A1.75 1.75 0 0 0 10.5 5L3.5 17A1.75 1.75 0 0 0 5 20H19A1.75 1.75 0 0 0 20.5 17Z"/>
      <line x1="12" y1="8.5" x2="12" y2="13"/>
      <circle cx="12" cy="15.5" r="0.75" fill="currentColor" stroke="none"/>
    </g>
  </symbol>

  <symbol id="clay-icon-alert-circle" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5"/>
      <line x1="12" y1="8" x2="12" y2="13.5"/>
      <circle cx="12" cy="16" r="0.75" fill="currentColor" stroke="none"/>
    </g>
  </symbol>

  <!-- 洞察与数据 -->
  <symbol id="clay-icon-lightbulb" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.3 1 2.1h5c0-.8.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>
    </g>
  </symbol>

  <symbol id="clay-icon-bar-chart" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4.5" y1="20" x2="19.5" y2="20"/>
      <line x1="8" y1="20" x2="8" y2="12.5"/>
      <line x1="12" y1="20" x2="12" y2="8"/>
      <line x1="16" y1="20" x2="16" y2="15.5"/>
    </g>
  </symbol>

</svg>
